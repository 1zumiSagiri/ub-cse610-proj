name: Compile Typst Document

on:
  push:
    branches: [master]
    paths:
      - 'prop/**'
      - '.github/workflows/doc.yml'
  pull_request:
    paths:
      - 'prop/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Typst
        uses: typst-community/setup-typst@v5

      - name: Create build directory
        run: mkdir -p build

      - name: Compile all documents
        run: |
          shopt -s nullglob
          for f in prop/*.typ; do
            typst compile "$f" "build/$(basename "${f%.typ}").pdf"
          done

      - name: Upload PDFs
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: pr-${{ github.event.number || 'master' }}-pdfs
          path: build/*.pdf
          archive: false
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        env:
          PDF_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `PDFs built successfully. [Download](${process.env.PDF_URL})`,
            });
